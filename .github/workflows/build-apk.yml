name: Build PDF Studio APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PDFStudio_Android_Project_v1.4_logo.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: unzip -o PDFStudio_Android_Project_v1.4_logo.zip

      - name: Build APK
        run: |
          chmod +x PDFStudio/gradlew
          ./PDFStudio/gradlew -p PDFStudio assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-APK
          path: PDFStudio/app/build/outputs/apk/debug/app-debug.apk
