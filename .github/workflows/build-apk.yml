name: Build PDF Studio APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PDFStudio_Android_Project_v1.4_logo.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.13
        run: |
          wget https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Extract project
        run: unzip -o PDFStudio_Android_Project_v1.4_logo.zip

      - name: Build APK
        run: gradle -p PDFStudio assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-APK
          path: PDFStudio/app/build/outputs/apk/debug/app-debug.apk
